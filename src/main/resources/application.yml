# mspace-gateway: 밖에서 들어오는 문 하나.
# nginx(학교 서버, HTTPS) → 이 게이트웨이 → web / core / agent
server:
  port: 8000

spring:
  application:
    name: mspace-gateway
  cloud:
    # 서비스 이름 → 주소 목록. 지금은 하나씩이고, 같은 서비스를 더 띄우면 [1], [2]를 더하면 돌아가며 보낸다(로드밸런싱)
    discovery:
      client:
        simple:
          instances:
            core:
              - uri: ${CORE_URI:http://core:8080}
            agent:
              - uri: ${AGENT_URI:http://agent:8091}
            web:
              - uri: ${WEB_URI:http://web:80}
    gateway:
      server:
        webflux:
          # 밖에서 온 X-User-Id는 지운다. 로컬 개발용 헤더라 core·mcp가 설정에 따라 믿을 수 있어서
          default-filters:
            - RemoveRequestHeader=X-User-Id
          httpclient:
            connect-timeout: 3000       # ms. 서비스가 꺼져 있으면 빨리 실패
            response-timeout: 90s       # 비서(agent)는 모델 응답을 기다려 오래 걸릴 수 있다
          # 위에서부터가 아니라 order 작은 것부터 맞춰 본다. /api/agent/** 를 /api/** 보다 먼저
          routes:
            # 비서 채팅은 core를 거치지 않고 agent로 바로 (v0.3)
            - id: agent
              uri: lb://agent
              order: 1
              predicates:
                - Path=/api/agent/**
            - id: core
              uri: lb://core
              order: 2
              predicates:
                # /actuator/health: 배포 뒤 core가 살아났는지 확인 (게이트웨이 자기 health는 관리 포트 8001에 따로)
                - Path=/api/**,/actuator/health
            # 나머지는 화면 파일 (PWA)
            - id: web
              uri: lb://web
              order: 3
              predicates:
                - Path=/**

mspace:
  jwt:
    secret: ${JWT_SECRET:}        # core와 같은 값. 비면 켜지지 않는다
    issuer: ${JWT_ISSUER:mspace-core}

management:
  # 게이트웨이 자기 상태는 다른 포트(8001, 밖으로 안 엶)에서. 8000의 /actuator/health는 core로 넘긴다
  server:
    port: ${MANAGEMENT_PORT:8001}
  endpoints:
    web:
      exposure:
        include: health
