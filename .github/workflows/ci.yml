# PR마다 빌드·테스트를 돌려서, 깨진 코드가 develop/main에 합쳐지지 않게 막는다.
name: CI

on:
  pull_request:              # PR을 열거나 새 커밋을 올릴 때
    branches: [develop, main]
  push:                      # 합쳐진 뒤에도 develop/main이 여전히 초록인지 확인
    branches: [develop, main]

# 같은 PR에 커밋을 연달아 올리면 이전 실행은 취소하고 최신 것만 돌린다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 이 워크플로는 코드를 읽기만 한다 (최소 권한)
permissions:
  contents: read

jobs:
  build:                     # 브랜치 보호에서 "필수 검사"로 고를 이름
    name: build
    runs-on: ubuntu-latest   # Docker가 깔려 있어서 Testcontainers가 그대로 돈다
    timeout-minutes: 15

    steps:
      - name: 코드 받기
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # 토큰을 .git 설정에 남기지 않는다 (뒤에 git push 같은 건 없음)
          fetch-depth: 0     # SonarQube가 "새 코드"를 가리려면 커밋 기록 전체가 필요

      - name: JDK 21 설치
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven       # ~/.m2를 캐시해서 두 번째부터 빨라진다

      - name: 빌드 + 테스트
        # -B: 로그를 CI용으로 간결하게
        # JaCoCo가 커버리지 보고서(jacoco.xml)를 만든다. SonarQube는 커버리지를 직접 재지 않고 이 파일을 읽는다
        run: ./mvnw -B verify

      # 1) develop/main에 합쳐진 뒤: 팀 SonarQube 서버에 결과를 기록만 한다 (막지 않음)
      #    Community Build는 브랜치·PR을 나눠 담지 못하고 프로젝트 하나에 덮어쓴다
      - name: SonarQube 분석
        if: github.event_name == 'push'
        # 토큰은 Sonar 단계에만 넘긴다. 빌드·테스트 단계(테스트 코드·의존성)가 토큰을 볼 수 없게
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}   # 팀 SonarQube 서버 주소 (스캐너가 이 환경변수를 읽는다)
        # Sonar 서버·토큰 문제로 develop 검사가 빨개지지 않게
        continue-on-error: true
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "SONAR_TOKEN이 없어 SonarQube 분석을 건너뜁니다."
            exit 0
          fi
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

      # 2) main으로 가는 PR: 팀 규칙(TEAM.md 7장)대로 "새 코드 커버리지 80% 이상, 중복 3% 이하, 새 버그·취약점 0건"을 통과해야 build가 초록.
      #    core와 같은 방식(11-06 재웅 결정 "코드 품질은 유하게, 커버리지는 그대로"). 학교 Sonar 기본 게이트(Sonar way)는
      #    새 이슈 0건·핫스팟 100% 검토까지 요구하는데 공용 계정은 게이트를 바꿀 권한이 없어서, 값을 API로 직접 읽어 판정한다.
      #    코드 스멜·핫스팟 검토는 대시보드에 남고 막지는 않는다. 토큰이 없으면 확인할 수 없으니 실패시킨다
      - name: SonarQube 품질 게이트 (main)
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_PROJECT: mspace-gateway
          MIN_COVERAGE: '80'
          MAX_DUPLICATION: '3'
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "SONAR_TOKEN이 없어 main 품질 게이트를 확인할 수 없습니다. 저장소 Secrets를 넣어 주세요."
            exit 1
          fi
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          bash .github/scripts/sonar-team-gate.sh
